                  value: REG-2026-002
                  description: ""
                  disabled: false
                - name: uploadedBy
                  value: merchant-user-123
                  description: ""
                  disabled: false
            headers:
              - name: Content-Type
                value: multipart/form-data
              - name: X-API-Key
                value: dms_dev_7f3b9c2e8a1d4f60b5c8e7a2d9f143b6
                description: ""
                disabled: false
            authentication:
              type: bearer
              token: "{{ _.accessTokenDMS }}"
              prefix: ""
            scripts:
              afterResponse: >-
                const response = insomnia.response.json();


                if (insomnia.response.code !== 201 || !response?.documents) {
                    console.log("Bulk upload gagal atau response tidak valid");
                    console.log("HTTP status:", insomnia.response.code);
                    console.log("Response:", JSON.stringify(response, null, 2));

                    return;
                }


                const documents = response.documents;

                const errors = response.errors || [];


                const documentIds = documents.map((document) => document.id);


                insomnia.environment.set("document_ids", documentIds);


                if (documentIds[0]) {
                    insomnia.environment.set("document_id", documentIds[0]);
                    insomnia.environment.set("ktp_document_id", documentIds[0]);
                }


                if (documentIds[1]) {
                    insomnia.environment.set("npwp_document_id", documentIds[1]);
                }


                if (documentIds[2]) {
                    insomnia.environment.set("supporting_document_id", documentIds[2]);
                }


                console.log(`Berhasil upload: ${documents.length} dokumen`);

                console.log("Document IDs:", documentIds);

                console.log(`Gagal upload: ${errors.length} dokumen`);


                if (errors.length > 0) {
                    console.log("Upload errors:", JSON.stringify(errors, null, 2));
                }
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
